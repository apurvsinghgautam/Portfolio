<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-72Q86HEPGV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-72Q86HEPGV');
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{postTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{siteUrl}}/assets/logo.png">
<meta property="article:published_time" content="{{dateIso}}">
<meta property="article:section" content="{{chip}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{postTitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{siteUrl}}/assets/logo.png">
<link rel="icon" type="image/png" href="{{siteUrl}}/assets/logo.png">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<script type="application/ld+json">{{{jsonld}}}</script>
</head>
<body>

<div class="masthead" id="masthead">
  <a class="masthead__home" href="{{siteUrl}}/" aria-label="{{author}} — home">
    <img class="masthead__logo" src="{{baseurl}}/assets/img/logo.png" alt="ASG">
  </a>
  <!-- Order and items must mirror the portfolio's nav exactly. -->
  <nav class="masthead__nav" id="mastheadNav">
    <a href="{{siteUrl}}/#about">ABOUT</a>
    <a href="{{siteUrl}}/#media">MEDIA</a>
    <a href="{{siteUrl}}/#projects">PROJECTS</a>
    <a href="{{siteUrl}}/#experience">EXPERIENCE</a>
    <a href="{{siteUrl}}/#research">RESEARCH</a>
    <a href="{{baseurl}}/" class="is-current">BLOG</a>
  </nav>
  <button class="masthead__toggle" id="mastheadToggle" type="button" aria-label="Menu" aria-controls="mastheadNav" aria-expanded="false">MENU ≡</button>
</div>

<main class="shell">
<article>
  <header class="post-head">
    <div class="breadcrumb"><a href="{{baseurl}}/">&larr; WRITING</a> &nbsp;/&nbsp; {{chip}}</div>
    <h1 class="post-head__title">{{postTitle}}</h1>
    <div class="post-meta">
      <span>PUBLISHED&nbsp;: <b>{{dateLong}}</b></span>
      <span>READ&nbsp;: <b>{{minutes}} MIN</b></span>
      <span>FILED&nbsp;: <b class="filed">{{chip}}</b></span>
    </div>
  </header>

  <div class="post-body">
    <aside class="rail">
      <details class="rail__toc" id="railToc" open{{tocHidden}}>
        <summary class="rail__label">CONTENTS</summary>
        <nav class="rail__list" id="toc">
          {{{toc}}}
        </nav>
      </details>
      <script>
        // CONTENTS sits above the article on narrow screens, so it starts collapsed
        // there; beside the article on desktop it stays pinned open. Runs inline so
        // the collapse happens before first paint.
        (function () {
          var toc = document.getElementById('railToc');
          if (!toc || toc.hidden) return;
          var narrow = window.matchMedia('(max-width: 860px)');
          function sync() { toc.open = !narrow.matches; }
          sync();
          if (narrow.addEventListener) narrow.addEventListener('change', sync);
          toc.querySelector('summary').addEventListener('click', function (e) {
            if (!narrow.matches) e.preventDefault();
          });
        })();
      </script>
      <div class="rail__share">SHARE&nbsp;//
        <a href="{{shareX}}" target="_blank" rel="noopener">X</a> &middot;
        <a href="{{shareLi}}" target="_blank" rel="noopener">LI</a> &middot;
        <a href="#" data-copy="{{copyUrl}}">COPY</a>
      </div>
    </aside>

    <div class="article">
{{{content}}}
{{{tagrow}}}
    </div>
  </div>

  <nav class="pager">
    {{{pagerPrev}}}
    {{{pagerNext}}}
  </nav>
</article>
</main>

<footer class="footer">
  <span>{{year}} &copy; {{author}}</span>
  <span class="footer__social">
    <a href="https://www.linkedin.com/in/{{li}}" target="_blank" rel="noopener">LINKEDIN</a>
    <a href="https://github.com/{{gh}}" target="_blank" rel="noopener">GITHUB</a>
    <a href="https://twitter.com/{{tw}}" target="_blank" rel="noopener">X</a>
  </span>
</footer>

<script>
  // Mobile header menu. Same behaviour as the portfolio nav (assets/js/main.js),
  // which blog pages do not load.
  (function () {
    var head = document.getElementById('masthead');
    var toggle = document.getElementById('mastheadToggle');
    var nav = document.getElementById('mastheadNav');
    if (!head || !toggle || !nav) return;
    function setOpen(open) {
      head.classList.toggle('is-open', open);
      toggle.textContent = open ? 'CLOSE ✕' : 'MENU ≡';
      toggle.setAttribute('aria-expanded', String(open));
    }
    toggle.addEventListener('click', function () { setOpen(!head.classList.contains('is-open')); });
    // Close the menu after tapping a nav link.
    nav.addEventListener('click', function (e) { if (e.target.tagName === 'A') setOpen(false); });
  })();

  // COPY link. Wired independently of the rail — posts with no h2 headings must
  // still get a working clipboard button.
  (function () {
    var copy = document.querySelector('[data-copy]');
    if (!copy) return;
    copy.addEventListener('click', function (e) {
      e.preventDefault();
      var url = copy.dataset.copy;
      var done = function () {
        var was = copy.textContent;
        copy.textContent = 'COPIED';
        setTimeout(function () { copy.textContent = was; }, 1400);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(done).catch(function () { window.prompt('Copy link:', url); });
      } else {
        window.prompt('Copy link:', url);
      }
    });
  })();

  // Scroll-spy for the CONTENTS rail. Links are emitted at build time.
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('#toc a'));
    if (!links.length) return;
    var heads = links
      .map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); })
      .filter(Boolean);
    if (!heads.length) return;

    function spy() {
      var best = 0;
      heads.forEach(function (h, i) { if (h.getBoundingClientRect().top <= 120) best = i; });
      links.forEach(function (a, i) { a.classList.toggle('is-active', i === best); });
    }
    spy();
    window.addEventListener('scroll', spy, { passive: true });
  })();
</script>
</body>
</html>
